name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  actions: read
  contents: write

jobs:
  verify-release-tag:
    name: Verify tag is current main
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag to point at current main
        run: |
          git fetch origin main
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "Release tag $GITHUB_REF_NAME points at $tag_commit, not main $main_commit"
            exit 1
          fi

  quality-gate:
    name: Run current CI on release commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify-release-record:
    name: Require hardware release rehearsal
    runs-on: ubuntu-latest
    outputs:
      candidate_run_id: ${{ steps.find-candidate.outputs.run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a passing hardware record for this tag
        run: |
          tested_commit="$(git rev-parse "${GITHUB_SHA}^1")"
          changed_files="$(git diff --name-only "$tested_commit" "${GITHUB_SHA}")"
          if [ "$changed_files" != "docs/release-validation.json" ]; then
            echo "Release record commit must change only docs/release-validation.json"
            exit 1
          fi
          python scripts/verify_release_readiness.py "${GITHUB_REF_NAME}" \
            --expected-commit "$tested_commit"

      - name: Find the successful CI run for the tested candidate
        id: find-candidate
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const testedCommit = execFileSync('git', ['rev-parse', 'HEAD^1'], { encoding: 'utf8' }).trim();
            const result = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: testedCommit,
              per_page: 100,
            });
            const candidate = result.data.workflow_runs.find(run =>
              run.event === 'push' &&
              run.head_branch === 'main' &&
              run.conclusion === 'success'
            );
            if (!candidate) {
              throw new Error(`No successful main CI run found for tested commit ${testedCommit}`);
            }
            core.setOutput('run_id', String(candidate.id));

  python-dist:
    name: Build Python package
    runs-on: ubuntu-latest
    needs:
      - verify-release-tag
      - quality-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - verify-release-tag
      - quality-gate
      - verify-release-record
      - python-dist

    steps:
      - name: Check out release record and verification script
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download hardware-tested Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-windows
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release-record.outputs.candidate_run_id }}

      - name: Download hardware-tested macOS candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-macos
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release-record.outputs.candidate_run_id }}

      - name: Download hardware-tested OTA candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-ota
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-release-record.outputs.candidate_run_id }}

      - name: Verify release candidate checksums
        run: python scripts/verify_release_artifacts.py docs/release-validation.json release-assets

      - name: Download Python package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
