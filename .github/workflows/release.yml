name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  verify-release-tag:
    name: Verify tag is current main
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag to point at current main
        run: |
          git fetch origin main
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "Release tag $GITHUB_REF_NAME points at $tag_commit, not main $main_commit"
            exit 1
          fi

  quality-gate:
    name: Run current CI on release commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify-release-record:
    name: Require hardware release rehearsal
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Require a passing hardware record for this tag
        run: >-
          python scripts/verify_release_readiness.py "${GITHUB_REF_NAME}"
          --expected-commit "${GITHUB_SHA}"

  python-dist:
    name: Build Python package
    runs-on: ubuntu-latest
    needs:
      - verify-release-tag
      - quality-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    needs:
      - verify-release-tag
      - quality-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Build executable
        run: python scripts/build_gui.py

      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path dist/Bambutton.exe -DestinationPath dist/Bambutton-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/Bambutton-windows.zip

  macos-app:
    name: Build macOS app
    runs-on: macos-latest
    needs:
      - verify-release-tag
      - quality-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Build app
        run: python scripts/build_gui.py

      - name: Package app bundle
        run: ditto -c -k --keepParent dist/Bambutton.app dist/Bambutton-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/Bambutton-macos.zip

  ota-bundle:
    name: Build MicroPython OTA bundle
    runs-on: ubuntu-latest
    needs:
      - verify-release-tag
      - quality-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build OTA bundle
        run: |
          python scripts/build_ota_bundle.py \
            --version "${GITHUB_REF_NAME#v}" \
            --output dist/bambutton-ota.json

      - name: Upload OTA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-bundle
          path: dist/bambutton-ota.json

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - verify-release-tag
      - quality-gate
      - verify-release-record
      - python-dist
      - windows-exe
      - macos-app
      - ota-bundle

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
